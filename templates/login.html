{% extends "base.html" %}

{% block title %}Admin Sign In - LibSphere{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="auth-title">Staff Portal</h1>
      <p class="auth-subtitle">Sign in to manage books, issue records, and catalog settings.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="login-submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" x2="3" y1="12" y2="12"/>
        </svg>
        Sign In
      </button>
    </form>

    <div class="demo-credentials-pill">
      <div><strong>Demo Credentials:</strong></div>
      <div>User: <code>admin</code> | Pass: <code>admin123</code></div>
      <button type="button" onclick="fillDemoCredentials()" id="btn-demo-autofill">⚡ Auto-fill credentials</button>
      <div style="clear: both;"></div>
    </div>
  </div>
</div>
{% endblock %}
