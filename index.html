<title>Advanced Library Management System</title>
<style>

:root[data-theme="dark"]{--bg:#17120e;--card:#221b15;--ink:#f1e9df;--mut:#a89b8c;--line:#3a2f26;--side:#0f0b08;--pri:#d08a54;--pri2:#e3a16b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .5rem}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f172a,#1e3a8a 55%,#7c3f1d)}
.lbox{background:var(--card);border-radius:16px;padding:32px;width:100%;max-width:400px;box-shadow:0 20px 50px #0006;animation:up .5s}
.shelf{display:flex;gap:4px;align-items:flex-end;height:60px;margin-bottom:14px;border-bottom:5px solid var(--pri)}
.shelf i{display:block;width:16px;border-radius:2px 2px 0 0;background:var(--pri2)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri2);outline-offset:1px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--pri2);transform:translateY(-1px)}.btn.sm{padding:5px 10px;font-size:13px}.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn.red{background:var(--bad)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--side);color:#eadfd2;padding:18px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));z-index:20;transition:.25s}
aside h2{color:#fff;font-size:17px;padding:0 8px 14px}
aside a{display:block;padding:10px 12px;border-radius:8px;color:inherit;text-decoration:none;margin-bottom:2px}
aside a:hover,aside a.on{background:#ffffff1f;color:#fff}
main{margin-left:220px;padding:20px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
#menu{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{font-size:28px;display:block;font-family:Georgia,serif}.stat span{color:var(--mut);font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.bar>*{flex:1;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:14px}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#0001}
.Available,.Returned,.Active{color:var(--ok)}.Issued{color:var(--warn)}.Overdue,.Unavailable,.Inactive{color:var(--bad)}
dialog{border:0;border-radius:14px;padding:22px;width:min(480px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:12px 18px;border-radius:10px;color:#fff;display:none;z-index:50;animation:up .3s}
.chart{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.chart div{height:18px;border-radius:4px;background:var(--pri2);min-width:4px;transition:width .6s}
#thanks{display:none;min-height:100vh;place-items:center;text-align:center;padding:20px;background:linear-gradient(135deg,#2b1a10,#7c3f1d);color:#fff}
#thanks h1{font-size:clamp(44px,12vw,88px)}
@media(max-width:800px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:14px}#menu{display:inline-block}}
.lwrap{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;max-width:920px;width:100%}
.hero{color:#fff}.hero h2{font-size:clamp(28px,5vw,44px);color:#fff}.hero p{opacity:.8;margin:0 0 18px}
#covers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cov{width:100%;filter:drop-shadow(0 8px 14px #0007);animation:up .6s both;transition:.2s}.cov:hover{transform:translateY(-6px) rotate(-2deg)}
.ro .edit{display:none!important}.tch td.edit.t{display:table-cell!important}.tch button.edit.t{display:inline-block!important}
@media(max-width:800px){.lwrap{grid-template-columns:1fr}#covers{grid-template-columns:repeat(6,1fr);gap:6px}}
.th{display:inline-grid;place-items:center;width:28px;height:40px;border-radius:2px 4px 4px 2px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font:700 10px Georgia,serif;border-left:4px solid #0005;margin-right:8px;vertical-align:middle}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:560px}

</head>

<section id="login"><div class="lwrap"><div class="hero"><h2>Digital Library</h2><p>Read. Borrow. Discover.</p><div id="covers"></div></div>
 <div class="lbox">
  <h1>Advanced Library</h1><p style="color:var(--mut);margin-top:0">Management System &mdash; librarian sign in</p>
  <label for="lid">Login ID</label>
  <input id="lid" autocomplete="username" placeholder="Enter your Login ID" onkeydown="if(event.key==='Enter')$('lpw').focus()">
  <label for="lpw">Password</label>
  <input id="lpw" type="password" autocomplete="current-password" placeholder="Enter your password" onkeydown="if(event.key==='Enter')login()">
  <div class="err" id="lerr" role="alert"></div>
  <button class="btn" style="width:100%;margin-top:6px" onclick="login()">Login</button>
  <p style="color:var(--mut);font-size:12px;margin-bottom:0">Librarian, Teacher and Student access.</p>
 </div></div>
</section>

<div id="app">

  <span style="color:var(--mut)">Signed in as <b id="who"></b></span></div>
  <div id="view"></div>

</div>

<section id="thanks"><div><h1>Thank You</h1><p>Thank you for using the Advanced Library Management System.</p><button class="btn" onclick="showLogin()">Back to Login</button></div></section>

 t.ret=r;t.fine=fineFor(t.due,r);S.tot.fine+=t.fine;const b=S.books.find(x=>x.id===t.bookId);if(b)b.avail=Math.min(b.qty,b.avail+1);S.tot.avail=Math.min(S.tot.books,S.tot.avail+1);log(`Returned ${t.bookId}, fine ₹${t.fine}`);save();toast(t.fine?`Returned. Fine: ₹${t.fine}`:'Book returned. No fine.');go('return')}

/* Search */
V.search=()=>`<h1>Search</h1><div class="bar"><datalist id="bn">${S.books.map(b=>`<option value="${esc(b.title)}">`).join('')}</datalist><input id="sq" list="bn" placeholder="Title, author, ISBN, category, Book ID, member name or ID…" aria-label="Search everything"></div><div id="sr"></div>`;
A.search=()=>{$('sq').oninput=()=>{const q=$('sq').value.trim().toLowerCase();if(!q){$('sr').innerHTML='<p style="color:var(--mut)">Type to search books and members.</p>';return}
 const B=S.books.filter(b=>[b.id,b.isbn,b.title,b.author,b.category].join(' ').toLowerCase().includes(q)),M=S.members.filter(m=>(m.id+' '+m.pid+' '+m.name).toLowerCase().includes(q));
 $('sr').innerHTML=`<div class="card"><h3>Books (${B.length})</h3>${tbl(['ID','ISBN','Book Name','Author','Category','Available','Status'],B.map(b=>`<tr><td>${b.id}</td><td>${esc(b.isbn)}</td><td>${thumb(b.title)}${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.category)}</td><td>${b.avail}/${b.qty}</td><td>${tag(b.avail>0?'Available':'Unavailable')}</td></tr>`))}</div><div class="card" style="margin-top:14px"><h3>Members (${M.length})</h3>${tbl(['ID','Name','Email','Phone','Status'],M.map(m=>`<tr><td>${m.id}</td><td>${esc(m.name)}</td><td>${esc(m.email)}</td><td>${esc(m.phone)}</td><td>${tag(m.status)}</td></tr>`),50)}</div>`};$('sq').oninput()};

/* Transactions */
V.transactions=()=>`<h1>Transactions</h1><div class="bar"><input id="tq" placeholder="Search…" aria-label="Search transactions"><select id="tf" aria-label="Status filter"><option value="">All</option><option>Issued</option><option>Returned</option><option>Overdue</option></select><select id="ts" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="fine">Highest fine</option></select></div><div class="card" id="tt"></div>`;
A.transactions=()=>{const d=()=>{const q=$('tq').value.toLowerCase(),f=$('tf').value,s=$('ts').value,bk=dict(S.books),mm=dict(S.members);
 let r=S.tx.filter(t=>(!f||status(t)===f)&&[t.id,t.bookId,t.memberId,bk[t.bookId]?.title,mm[t.memberId]?.name,mm[t.memberId]?.pid].join(' ').toLowerCase().includes(q));
 r=s==='old'?r:s==='fine'?r.sort((a,b)=>b.fine-a.fine):[...r].reverse();$('tt').innerHTML=tbl(TXH,r.map(txRow))};['tq','tf','ts'].forEach(i=>$(i).oninput=d);d()};

/* Reports */
const chart=(rows,unit)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(([n,v])=>`<div class="chart"><span style="width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><div style="width:${v/mx*55}%"></div><b>${v}${unit||''}</b></div>`).join('')||'<span style="color:var(--mut)">No data yet.</span>'};
V.reports=()=>{const c=counts(),bc={},mc={};S.tx.forEach(t=>{bc[t.bookId]=(bc[t.bookId]||0)+1;mc[t.memberId]=(mc[t.memberId]||0)+1});
 const top=(o,src,f)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>[f(dict(src)[k]||{}),v]);
 return`<h1>Reports</h1><div class="grid">${stat(c.books,'Total Books')}${stat(c.avail,'Available')}${stat(c.issued,'Issued')}${stat(c.members,'Members')}${stat(c.over,'Overdue')}${stat('₹'+c.fines,'Fines Collected')}</div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Most Issued Books</h3>${chart(top(bc,S.books,b=>b.title))}</div><div class="card"><h3>Most Active Members</h3>${chart(top(mc,S.members,m=>m.name))}</div></div>
<div class="card"><h3>Books by Category</h3>${chart(categories().map(c=>[c,S.books.filter(b=>b.category===c).length]))}</div>
<button class="btn ghost edit" style="margin-top:14px" onclick="if(confirm('Reset all data to the sample data?')){S=seed();save();go('dashboard')}">Reset sample data</button>`};

V.about=()=>`<h1>About</h1><div class="card"><h3>Advanced Library Management System</h3><p>The Advanced Library Management System makes library operations faster, more organized, and easier to manage. Instead of maintaining large amounts of information in paper registers, librarians can manage records digitally and retrieve information quickly.</p><p>Data structures used: <b>lists</b> (books, transactions), <b>dictionaries</b> (fast ID lookup), <b>sets</b> (unique categories), <b>a stack</b> (recent actions) and <b>a queue</b> (notifications).</p><p style="color:var(--mut)">Data is saved in this browser.</p></div>`;


const COV=[['Clean Code','#0f766e','#134e4a'],['Algorithms','#1d4ed8','#1e3a8a'],['1984','#b91c1c','#7f1d1d'],['Sapiens','#b45309','#78350f'],['Wings of Fire','#c2410c','#7c2d12'],['Python','#4d7c0f','#365314']];
const covHTML=p=>COV.map(([t,a,b],i)=>`<svg viewBox="0 0 90 130" class="cov" style="animation-delay:${i*.12}s" role="img" aria-label="${t} book cover"><defs><linearGradient id="${p}${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="90" height="130" rx="4" fill="url(#${p}${i})"/><rect width="8" height="130" fill="#0004"/><circle cx="52" cy="44" r="18" fill="none" stroke="#fff6" stroke-width="2"/><path d="M40 44h24M52 32v24" stroke="#fff6" stroke-width="2"/><text x="52" y="98" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="11" font-weight="700">${t}</text><rect x="30" y="110" width="44" height="2" fill="#fff8"/></svg>`).join('');$('covers').innerHTML=covHTML('L');
try{const r=sessionStorage.getItem('role');if(ACL[r]){ROLE=r;enter()}}catch(e){}
</script>
</body>
